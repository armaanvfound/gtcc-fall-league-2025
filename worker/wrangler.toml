name = "rcb-ask"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
# Browsers may only call the proxy from these origins. Add localhost while testing.
ALLOWED_ORIGINS = "https://armaanvfound.github.io,http://localhost:8899"

# Where the proxy reads the dashboard's numbers from. Rebuilding the site and
# pushing updates the assistant on its own - no redeploy needed here.
FACTS_URL = "https://armaanvfound.github.io/gtcc-fall-league-2025/facts.json"

# The capable model. This is the team's match-day reference, so it is worth the
# difference: roughly 0.3c a question against 0.03c on deepseek-v4-flash - still
# hundreds of questions per dollar. Drop to "deepseek-v4-flash" to spend less.
MODEL = "deepseek-v4-pro"

# Reasoning is enabled in worker.js; this is how hard it thinks before answering.
# low | medium | high. High, because multi-part questions ("where are we weakest,
# and who fixes it") are exactly what this gets asked.
REASONING_EFFORT = "high"

# Thinking and the answer share this budget. It is a ceiling, not a spend - you
# pay for tokens used - so it is set well clear of a long think. Running out mid
# thought is what produced an empty answer; the worker also retries once at
# double this if it ever happens again.
MAX_TOKENS = "8000"

# Spend guards. Only enforced when the KV namespace below is bound.
MAX_PER_IP_HOUR = "40"
MAX_PER_DAY = "500"

# Optional but recommended - this is what makes the daily cap a hard ceiling.
# Create it, then uncomment and paste the id:
#   npx wrangler kv namespace create ASK_KV
#
# [[kv_namespaces]]
# binding = "ASK_KV"
# id = "paste-the-id-wrangler-prints"

# Secrets are NOT set here, so they never enter git. Set them from your terminal:
#   npx wrangler secret put DEEPSEEK_API_KEY
#   npx wrangler secret put TEAM_PASS
