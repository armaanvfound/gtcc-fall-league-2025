name = "rcb-ask"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
# Browsers may only call the proxy from these origins. Add localhost while testing.
ALLOWED_ORIGINS = "https://armaanvfound.github.io,http://localhost:8899"

# Where the proxy reads the dashboard's numbers from. Rebuilding the site and
# pushing updates the assistant on its own - no redeploy needed here.
FACTS_URL = "https://armaanvfound.github.io/gtcc-fall-league-2025/facts.json"

# DeepSeek's most capable model. deepseek-v4-flash is the cheaper, lighter one.
MODEL = "deepseek-v4-pro"

# Reasoning is enabled in worker.js. This sets how hard it thinks before
# answering, and is the main cost lever: low | medium | high.
REASONING_EFFORT = "high"

# Thinking and the answer share this budget, so it sits well above reply length.
MAX_TOKENS = "3000"

# Spend guards. Only enforced when the KV namespace below is bound.
MAX_PER_IP_HOUR = "40"
MAX_PER_DAY = "500"

# Optional but recommended - this is what makes the daily cap a hard ceiling.
# Create it, then uncomment and paste the id:
#   npx wrangler kv namespace create ASK_KV
#
# [[kv_namespaces]]
# binding = "ASK_KV"
# id = "paste-the-id-wrangler-prints"

# Secrets are NOT set here, so they never enter git. Set them from your terminal:
#   npx wrangler secret put DEEPSEEK_API_KEY
#   npx wrangler secret put TEAM_PASS
